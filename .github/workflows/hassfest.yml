name: Validate integration with hassfest

on:
  push:
    branches:
      - main
      - "rel/*"
      - "val/*"
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
